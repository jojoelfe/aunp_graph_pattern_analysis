# Configuration file for AUNP Graph Pattern Analysis

[analysis]

# Base paths
basefolder = "/nrs/elferich/gouaux_tomo/15F1-H4K2Cys/TOP_TOMOS"
output_folder = "./output_h4kcys"

# Tomograms to analyze — loaded from CSV
# CSV columns: tomoname, set, alignment_dir, aunp_active_zones
tomogram_csv = "./inputs/tomograms_15F1-H4K2Cys_JE_subset.csv"

# Use manually curated star files when available (_manual_refined > _manual > plain)
use_manual_star = true

# Graph construction parameters
kdt_max_distance = 12.0  # Maximum distance for KD-tree query (nm)
kdt_min_distance = 0.0   # Minimum distance filter (nm)
subgraph_size = 4        # Size of connected subgraphs to find

# Alignment parameters
rmsd_max_value = 5.0     # Maximum RMSD for visualization

# Embedding parameters
tsne_perplexity = 20
tsne_n_components = 2
pca_n_components = 2

# Test shape (optional)
include_test_shape = true
test_shape_coordinates = [
    [0.0, 0.0, 0.0],
    [9.0, 0.0, 0.0],
    [18.0, 0.0, 0.0],
    [27.0, 0.0, 0.0],
]

# Simulated comparison star files
sim_crystal_star_file = "/scratch/pompeii/elferich/gouaux_tomo/ProcessingJE/solid_vs_liquid_2d-crystal-vs-liquid-aunp/data/crystal_aunp.star"
sim_liquid_star_file = "/scratch/pompeii/elferich/gouaux_tomo/ProcessingJE/solid_vs_liquid_2d-crystal-vs-liquid-aunp/data/liquid_resolved_aunp.star"

# Decoy subgraphs from liquid model (disabled — no longer needed)
# decoy_star_file = "/scratch/pompeii/elferich/gouaux_tomo/ProcessingJE/solid_vs_liquid_2d-crystal-vs-liquid-aunp/data/liquid_resolved_aunp.star"
# decoy_noise_sigma = 1.0       # nm Gaussian noise applied to positions
# decoy_n_subgraphs = 2000      # Number of decoy subgraphs to include
# decoy_seed = 42

# Membrane normal constraint
membrane_type = "postsynaptic"  # "postsynaptic" or "presynaptic"

# Diagnostic options
generate_diagnostics = true
diagnostics_folder = "./diagnostics_h4kcys"
n_subgraphs_to_highlight = 5  # Number of subgraphs to highlight in diagnostic plots
